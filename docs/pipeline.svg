<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" role="img" aria-label="Past papers in, new questions out" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1a19"/>
      <stop offset="100%" stop-color="#262220"/>
    </linearGradient>

    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2603c" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#e2603c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.35"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- Soru kartındaki metin, çizilirken soldan açılıyor. -->
    <clipPath id="reveal">
      <rect x="632" y="60" width="0" height="90">
        <animate attributeName="width" values="0;0;186;186;0"
                 keyTimes="0;0.45;0.72;0.94;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="860" height="200" rx="18" fill="url(#panel)"/>
  <rect x="0.5" y="0.5" width="859" height="199" rx="17.5" fill="none"
        stroke="#3a3431" stroke-width="1"/>

  <!-- ============ 1. Çıkmış sınav kâğıdı ============ -->
  <g transform="translate(46,52)">
    <rect width="76" height="96" rx="6" fill="#2f2a27" stroke="#4a423e"/>
    <g fill="#6b6560">
      <rect x="12" y="16" width="52" height="4" rx="2"/>
      <rect x="12" y="28" width="38" height="4" rx="2"/>
      <rect x="12" y="44" width="52" height="4" rx="2"/>
      <rect x="12" y="56" width="44" height="4" rx="2"/>
      <rect x="12" y="72" width="30" height="4" rx="2"/>
    </g>
    <!-- Tarayıcı çizgisi: metnin çıkarıldığı an. -->
    <rect x="6" y="8" width="64" height="2" fill="#e2603c" opacity="0.9">
      <animate attributeName="y" values="8;80;8" dur="7s" repeatCount="indefinite"
               keyTimes="0;0.28;1" calcMode="spline"
               keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="7s"
               keyTimes="0;0.05;0.26;0.3" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="84" y="172" text-anchor="middle" fill="#8a8078"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    past paper
  </text>

  <!-- ============ Hat ============ -->
  <path d="M134 100 H 300" stroke="url(#wire)" stroke-width="2" fill="none"/>
  <path d="M368 100 H 500" stroke="url(#wire)" stroke-width="2" fill="none"/>
  <path d="M566 100 H 628" stroke="url(#wire)" stroke-width="2" fill="none"/>

  <!-- Hattı geçen veri parçacıkları -->
  <g fill="#e2603c">
    <circle r="3.5" cx="0" cy="0">
      <animateMotion path="M134 100 H 300" dur="7s" begin="0.6s" repeatCount="indefinite"
                     keyPoints="0;1" keyTimes="0;0.22" calcMode="linear"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="7s" begin="0.6s"
               keyTimes="0;0.02;0.2;0.22" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" cx="0" cy="0" opacity="0.6">
      <animateMotion path="M134 100 H 300" dur="7s" begin="1.0s" repeatCount="indefinite"
                     keyPoints="0;1" keyTimes="0;0.22" calcMode="linear"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" dur="7s" begin="1.0s"
               keyTimes="0;0.02;0.2;0.22" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ 2. Vektör deposu ============ -->
  <g transform="translate(300,62)">
    <ellipse cx="34" cy="10" rx="34" ry="10" fill="#332c28" stroke="#4a423e"/>
    <path d="M0 10 V 66 A 34 10 0 0 0 68 66 V 10" fill="#2b2522" stroke="#4a423e"/>
    <ellipse cx="34" cy="38" rx="34" ry="10" fill="none" stroke="#4a423e" opacity="0.5"/>
    <ellipse cx="34" cy="66" rx="34" ry="10" fill="none" stroke="#4a423e" opacity="0.5"/>
    <!-- Depo, veri geldiğinde parlıyor -->
    <ellipse cx="34" cy="10" rx="34" ry="10" fill="#e2603c" opacity="0">
      <animate attributeName="opacity" values="0;0.35;0" dur="7s" begin="0s"
               keyTimes="0;0.24;0.34" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <text x="334" y="172" text-anchor="middle" fill="#8a8078"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    chroma
  </text>

  <g fill="#e2603c">
    <circle r="3.5" cx="0" cy="0">
      <animateMotion path="M368 100 H 500" dur="7s" begin="2.4s" repeatCount="indefinite"
                     keyPoints="0;1" keyTimes="0;0.18" calcMode="linear"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="7s" begin="2.4s"
               keyTimes="0;0.02;0.16;0.18" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ 3. Üretici + hakem ============ -->
  <g transform="translate(500,64)">
    <rect width="66" height="72" rx="10" fill="#2f2a27" stroke="#4a423e"/>
    <!-- düşünme nabzı -->
    <circle cx="33" cy="36" r="16" fill="#e2603c" opacity="0.18" filter="url(#soft)">
      <animate attributeName="r" values="12;22;12" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="33" cy="36" r="9" fill="none" stroke="#e2603c" stroke-width="2"
            stroke-dasharray="40 16">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 33 36" to="360 33 36" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- hakem onayı: dönen halka duruyor, tik çiziliyor -->
    <path d="M22 36 l 8 9 l 16 -19" fill="none" stroke="#22c55e" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="46" stroke-dashoffset="46" opacity="0">
      <animate attributeName="stroke-dashoffset" values="46;46;0;0;46" dur="7s"
               keyTimes="0;0.4;0.5;0.9;1" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" dur="7s"
               keyTimes="0;0.39;0.5;0.9;1" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="533" y="172" text-anchor="middle" fill="#8a8078"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    generate → judge
  </text>

  <!-- ============ 4. Yeni soru ============ -->
  <g transform="translate(628,48)">
    <rect width="196" height="104" rx="10" fill="#2b2522" stroke="#e2603c" stroke-opacity="0.55"/>
    <g clip-path="url(#reveal)" transform="translate(-628,-48)">
      <text x="648" y="82" fill="#d8d2cc"
            font-family="Georgia, 'Times New Roman', serif" font-size="14">
        Is S linearly
      </text>
      <text x="648" y="102" fill="#d8d2cc"
            font-family="Georgia, 'Times New Roman', serif" font-size="14">
        independent?
      </text>
      <!-- küçük matris -->
      <g stroke="#e2603c" stroke-width="1.6" fill="none" opacity="0.9">
        <path d="M742 68 h -6 v 34 h 6"/>
        <path d="M796 68 h 6 v 34 h -6"/>
      </g>
      <g fill="#c9c2bb" font-family="ui-monospace, Menlo, monospace" font-size="12">
        <text x="748" y="82">2  1</text>
        <text x="748" y="98">1  1</text>
      </g>
    </g>
    <!-- imleç -->
    <rect x="0" y="12" width="2" height="18" fill="#e2603c">
      <animate attributeName="x" values="20;20;188;188;20"
               keyTimes="0;0.45;0.72;0.94;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0"
               keyTimes="0;0.44;0.46;0.93;0.95" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="726" y="172" text-anchor="middle" fill="#8a8078"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    a question that did not exist before
  </text>
</svg>
